name: Data Pipeline

on:
  workflow_dispatch:
    inputs:
      run_spark:
        description: "Run the Spark cleaning step"
        type: boolean
        default: true
      run_dbt:
        description: "Run dbt models + tests"
        type: boolean
        default: true

  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spark:
    name: Spark cleaning (public → curated)
    if: ${{ github.event_name == 'schedule' || inputs.run_spark }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Spark and Postgres JDBC driver
        run: |
          pip install --no-cache-dir pyspark==3.5.1
          curl -fsSL -o /tmp/postgresql.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar

      - name: Run Spark cleaning job
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: require
        run: |
          spark-submit \
            --master 'local[2]' \
            --driver-memory 2g \
            --jars /tmp/postgresql.jar \
            data-eng/spark/jobs/clean_all.py

  dbt:
    name: dbt models + tests (curated → analytics)
    needs: [spark]
    if: >-
      ${{
        always()
        && (needs.spark.result == 'success' || needs.spark.result == 'skipped')
        && (github.event_name == 'schedule' || inputs.run_dbt)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove any preinstalled dbt binaries
        run: |
          pip uninstall -y dbt dbt-oss dbt-core dbt-postgres dbt-adapters \
            2>/dev/null || true

      - name: Install classic dbt (core 1.8.2 + postgres adapter)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --force-reinstall \
            "dbt-core==1.8.2" \
            "dbt-postgres==1.8.2"

      - name: Verify dbt is the classic engine
        run: |
          dbt --version
          if dbt --version | grep -qiE "dbt-oss|fusion"; then
            echo "❌ Fusion detected"
            exit 1
          fi
          if ! dbt --version | grep -qi "postgres"; then
            echo "❌ postgres adapter missing"
            exit 1
          fi
          echo "✅ classic dbt-core 1.x"

      # -------------------------------------------------------------------
      # Diagnostic: byte-level dump of every secret (masking-proof)
      # -------------------------------------------------------------------
      - name: Debug secrets (byte-level)
        env:
          RAW_HOST: ${{ secrets.POSTGRES_HOST }}
          RAW_PORT: ${{ secrets.POSTGRES_PORT }}
          RAW_DB: ${{ secrets.POSTGRES_DB }}
          RAW_USER: ${{ secrets.POSTGRES_USER }}
          RAW_PW: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "=========== POSTGRES_HOST ==========="
          echo "length: ${#RAW_HOST}"
          printf '%s' "$RAW_HOST" | od -c
          echo
          echo "=========== POSTGRES_PORT ==========="
          echo "length: ${#RAW_PORT}"
          printf '%s' "$RAW_PORT" | od -c
          echo
          echo "=========== POSTGRES_DB ==========="
          echo "length: ${#RAW_DB}"
          printf '%s' "$RAW_DB" | od -c
          echo
          echo "=========== POSTGRES_USER ==========="
          echo "length: ${#RAW_USER}"
          printf '%s' "$RAW_USER" | od -c
          echo
          echo "=========== POSTGRES_PASSWORD (length only) ==========="
          echo "length: ${#RAW_PW}"
          printf '%s' "$RAW_PW" | od -c | head -3
          echo

      # -------------------------------------------------------------------
      # Normalize: extract bare components even if a full URL was pasted
      # -------------------------------------------------------------------
      - name: Normalize secrets
        env:
          RAW_HOST: ${{ secrets.POSTGRES_HOST }}
          RAW_PORT: ${{ secrets.POSTGRES_PORT }}
          RAW_DB: ${{ secrets.POSTGRES_DB }}
          RAW_USER: ${{ secrets.POSTGRES_USER }}
          RAW_PW: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          clean_host() {
            local v="$1"
            # strip scheme
            v="${v#*://}"
            # strip user:pass@
            v="${v##*@}"
            # strip path & query
            v="${v%%/*}"
            v="${v%%\?*}"
            # strip port
            v="${v%%:*}"
            # strip ALL whitespace
            v="$(printf '%s' "$v" | tr -d '[:space:]')"
            printf '%s' "$v"
          }

          HOST="$(clean_host "$RAW_HOST")"
          PORT="$(printf '%s' "$RAW_PORT" | tr -cd '0-9')"
          DB="$(printf '%s' "$RAW_DB" | tr -d '[:space:]')"
          USER="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          PW="$(printf '%s' "$RAW_PW" | sed -e 's/[[:space:]]*$//')"

          [ -z "$PORT" ] && PORT=5432

          echo "cleaned host: $HOST"
          echo "cleaned port: $PORT"
          echo "cleaned db:   $DB"
          echo "cleaned user: $USER"

          {
            echo "POSTGRES_HOST=$HOST"
            echo "POSTGRES_PORT_INTERNAL=$PORT"
            echo "POSTGRES_DB=$DB"
            echo "POSTGRES_USER=$USER"
            echo "POSTGRES_PASSWORD=$PW"
          } >> "$GITHUB_ENV"

      - name: dbt deps
        working-directory: data-eng/dbt
        run: dbt deps

      - name: dbt run
        working-directory: data-eng/dbt
        env:
          DBT_TARGET: ci
        run: |
          dbt run --profiles-dir . --vars '{source_schema: curated}'

      - name: dbt test
        working-directory: data-eng/dbt
        env:
          DBT_TARGET: ci
        run: |
          dbt test --profiles-dir . --vars '{source_schema: curated}'