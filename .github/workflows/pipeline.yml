name: Data Pipeline

on:
  workflow_dispatch:
    inputs:
      run_spark:
        description: "Run the Spark cleaning step"
        type: boolean
        default: true
      run_dbt:
        description: "Run dbt models + tests"
        type: boolean
        default: true

  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # Spark: public.* → curated.*
  # =========================================================================
  spark:
    name: Spark cleaning (public → curated)
    if: ${{ github.event_name == 'schedule' || inputs.run_spark }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Spark and Postgres JDBC driver
        run: |
          pip install --no-cache-dir pyspark==3.5.1
          curl -fsSL -o /tmp/postgresql.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar

      - name: Run Spark cleaning job
        env:
          # Values are normalized inside clean_all.py via _clean_host() etc.
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: require
        run: |
          spark-submit \
            --master 'local[2]' \
            --driver-memory 2g \
            --jars /tmp/postgresql.jar \
            data-eng/spark/jobs/clean_all.py

  # =========================================================================
  # dbt: curated.* → analytics.*
  # =========================================================================
  dbt:
    name: dbt models + tests (curated → analytics)
    needs: [spark]
    if: >-
      ${{
        always()
        && (needs.spark.result == 'success' || needs.spark.result == 'skipped')
        && (github.event_name == 'schedule' || inputs.run_dbt)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove any preinstalled dbt binaries
        run: |
          pip uninstall -y dbt dbt-oss dbt-core dbt-postgres dbt-adapters \
            2>/dev/null || true

      - name: Install classic dbt (core 1.8.2 + postgres adapter)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --force-reinstall \
            "dbt-core==1.8.2" \
            "dbt-postgres==1.8.2"

      - name: Verify dbt is the classic engine
        run: |
          echo "--- which dbt ---"
          which dbt
          echo
          echo "--- dbt --version ---"
          dbt --version
          echo

          if dbt --version | grep -qiE "dbt-oss|fusion"; then
            echo "❌ Wrong dbt binary — Fusion engine detected"
            exit 1
          fi

          if ! dbt --version | grep -qi "postgres"; then
            echo "❌ dbt-postgres adapter not installed"
            exit 1
          fi

          if ! dbt --version | grep -qE "installed: 1\."; then
            echo "❌ Expected dbt-core 1.x — got something else"
            exit 1
          fi

          echo "✅ Classic dbt-core 1.x with postgres adapter"

      - name: Debug connection params (safe)
        # Prints hostname, port, db, user, and password LENGTH — never the
        # password itself. Helps diagnose trailing-whitespace issues.
        env:
          RAW_HOST: ${{ secrets.POSTGRES_HOST }}
          RAW_PORT: ${{ secrets.POSTGRES_PORT }}
          RAW_DB: ${{ secrets.POSTGRES_DB }}
          RAW_USER: ${{ secrets.POSTGRES_USER }}
          RAW_PW: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "raw host:  '${RAW_HOST}'  (len=${#RAW_HOST})"
          echo "raw port:  '${RAW_PORT}'  (len=${#RAW_PORT})"
          echo "raw db:    '${RAW_DB}'  (len=${#RAW_DB})"
          echo "raw user:  '${RAW_USER}'  (len=${#RAW_USER})"
          echo "raw pw len: ${#RAW_PW}"

      - name: dbt deps
        working-directory: data-eng/dbt
        run: dbt deps

      - name: dbt run
        working-directory: data-eng/dbt
        env:
          DBT_TARGET: ci
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          # Trim any trailing whitespace/newlines from secret values.
          # GitHub's secret UI often appends a newline on paste.
          export POSTGRES_HOST="$(printf '%s' "$POSTGRES_HOST" | tr -d '[:space:]')"
          export POSTGRES_PORT_INTERNAL="$(printf '%s' "$POSTGRES_PORT_INTERNAL" | tr -d '[:space:]')"
          export POSTGRES_DB="$(printf '%s' "$POSTGRES_DB" | tr -d '[:space:]')"
          export POSTGRES_USER="$(printf '%s' "$POSTGRES_USER" | tr -d '[:space:]')"
          export POSTGRES_PASSWORD="$(printf '%s' "$POSTGRES_PASSWORD" | sed -e 's/[[:space:]]*$//')"

          dbt run --profiles-dir . --vars '{source_schema: curated}'

      - name: dbt test
        working-directory: data-eng/dbt
        env:
          DBT_TARGET: ci
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          export POSTGRES_HOST="$(printf '%s' "$POSTGRES_HOST" | tr -d '[:space:]')"
          export POSTGRES_PORT_INTERNAL="$(printf '%s' "$POSTGRES_PORT_INTERNAL" | tr -d '[:space:]')"
          export POSTGRES_DB="$(printf '%s' "$POSTGRES_DB" | tr -d '[:space:]')"
          export POSTGRES_USER="$(printf '%s' "$POSTGRES_USER" | tr -d '[:space:]')"
          export POSTGRES_PASSWORD="$(printf '%s' "$POSTGRES_PASSWORD" | sed -e 's/[[:space:]]*$//')"

          dbt test --profiles-dir . --vars '{source_schema: curated}'