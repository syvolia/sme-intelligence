name: Data Pipeline

on:
  # Manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      run_spark:
        description: "Run the Spark cleaning step"
        type: boolean
        default: true
      run_dbt:
        description: "Run dbt models + tests"
        type: boolean
        default: true

  # Daily at 03:00 UTC (06:00 Nairobi)
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spark:
    name: Spark cleaning (public → curated)
    if: ${{ github.event_name == 'schedule' || inputs.run_spark }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Spark and Postgres driver
        run: |
          pip install pyspark==3.5.1
          curl -fsSL -o /tmp/postgresql.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar

      - name: Run Spark cleaning job
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: require
        run: |
          spark-submit \
            --master 'local[2]' \
            --driver-memory 2g \
            --jars /tmp/postgresql.jar \
            data-eng/spark/jobs/clean_all.py

  dbt:
    name: dbt models + tests (curated → analytics)
    needs: [spark]
    if: ${{ always() && (needs.spark.result == 'success' || needs.spark.result == 'skipped') && (github.event_name == 'schedule' || inputs.run_dbt) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-postgres==1.8.2

      - name: dbt deps
        working-directory: data-eng/dbt
        run: dbt deps

      - name: dbt run
        working-directory: data-eng/dbt
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          dbt run --profiles-dir . --vars '{source_schema: curated}'

      - name: dbt test
        working-directory: data-eng/dbt
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT_INTERNAL: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          dbt test --profiles-dir . --vars '{source_schema: curated}'