name: sme-intelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: sme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: sme_mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /mlflow/db /mlflow/artifacts
        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:////mlflow/db/mlflow.db \
          --default-artifact-root /mlflow/artifacts \
          --serve-artifacts
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).status==200 else sys.exit(1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: sme_backend
    restart: unless-stopped
    environment:
      API_ENV: ${API_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MLFLOW_DEMAND_MODEL_NAME: ${MLFLOW_DEMAND_MODEL_NAME:-demand_forecast_xgboost}
      MLFLOW_CHAMPION_ALIAS: ${MLFLOW_CHAMPION_ALIAS:-champion}
      PYTHONPATH: /app:/ml
      WAREHOUSE_ENABLED: ${WAREHOUSE_ENABLED:-false}
      WAREHOUSE_SCHEMA: ${WAREHOUSE_SCHEMA:-analytics}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - mlflow_data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sme_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  ml:
    profiles: ["ml"]
    build:
      context: ./ml
    container_name: sme_ml
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MLFLOW_DEMAND_MODEL_NAME: ${MLFLOW_DEMAND_MODEL_NAME:-demand_forecast_xgboost}
      DAGSHUB_OWNER: ${DAGSHUB_OWNER:-syvoliamary}
      DAGSHUB_REPO: ${DAGSHUB_REPO:-sme-intelligence}
      DAGSHUB_USER_TOKEN: ${DAGSHUB_USER_TOKEN:-}
    volumes:
      - ./ml:/app
      - mlflow_data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

  # ─── Data engineering ──────────────────────────────────────────────────
  spark:
    profiles: ["data"]
    build:
      context: ./data-eng/spark
    image: sme-intelligence-spark:latest
    container_name: sme_spark
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data-eng/spark/jobs:/opt/spark/work-dir/jobs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

  dbt:
    profiles: ["data"]
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    container_name: sme_dbt
    working_dir: /dbt
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data-eng/dbt:/dbt
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]

  # ─── Airflow ───────────────────────────────────────────────────────────
  airflow-init:
    profiles: ["airflow"]
    build:
      context: ./data-eng/airflow
    image: sme-intelligence-airflow:latest
    container_name: sme_airflow_init
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "vJv5w_5vdLB0XkXtw5j5-j5VDGqhjTb9Cz-5Mx8q0-k="
    volumes:
      - ./data-eng/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    profiles: ["airflow"]
    image: sme-intelligence-airflow:latest
    container_name: sme_airflow_web
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "vJv5w_5vdLB0XkXtw5j5-j5VDGqhjTb9Cz-5Mx8q0-k="
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./data-eng/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "webserver", "--port", "8080"]

  airflow-scheduler:
    profiles: ["airflow"]
    image: sme-intelligence-airflow:latest
    container_name: sme_airflow_sched
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "vJv5w_5vdLB0XkXtw5j5-j5VDGqhjTb9Cz-5Mx8q0-k="
    volumes:
      - ./data-eng/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "scheduler"]

volumes:
  postgres_data:
  mlflow_data: