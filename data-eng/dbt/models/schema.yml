version: 2

models:
  - name: stg_sales
    columns:
      - name: sale_id
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              values: ['paid', 'pending', 'cancelled']

  - name: stg_sale_items
    columns:
      - name: item_id
        tests: [not_null, unique]
      - name: sale_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sales')
              field: sale_id

  - name: stg_purchase_orders
    columns:
      - name: po_id
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              values: ['open', 'received', 'cancelled']

  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]

  - name: dim_product
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null, unique]
      - name: sku
        tests: [not_null, unique]

  - name: dim_customer
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]

  - name: dim_supplier
    columns:
      - name: supplier_key
        tests: [not_null, unique]

  - name: dim_location
    columns:
      - name: location_key
        tests: [not_null, unique]

  - name: fact_sales
    columns:
      - name: sale_key
        tests: [not_null, unique]
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: location_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: quantity
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
              config:
                severity: warn

  - name: fact_payments
    columns:
      - name: payment_key
        tests: [not_null, unique]
      - name: direction
        tests:
          - accepted_values:
              values: ['in', 'out']

  - name: fact_purchase_orders
    columns:
      - name: po_key
        tests: [not_null, unique]
      - name: supplier_key
        tests:
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key

  - name: fact_inventory_snapshot
    columns:
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: location_key
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: risk
        tests:
          - accepted_values:
              values: ['HEALTHY', 'LOW', 'CRITICAL']

  - name: mart_customer_rfm
    columns:
      - name: segment
        tests:
          - accepted_values:
              values: ['High Value', 'Loyal', 'At Risk', 'New', 'Inactive']